services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-employees}
      POSTGRES_USER: ${DB_USERNAME:-employees}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-employees}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - employee-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 15
  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-employees}
      DB_USERNAME: ${DB_USERNAME:-employees}
      DB_PASSWORD: ${DB_PASSWORD:-employees}
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME:-admin}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:?Set APP_ADMIN_PASSWORD in .env (at least 12 characters)}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  employee-data:
